---
- name: Canary Deploy (first node)
  hosts: all[0]
  connection: local
  gather_facts: false
  vars:
    docker_compose_file: docker/docker-compose.yml
    docker_compose_dir: "{{ playbook_dir }}/.."
    override_dir: /tmp

  tasks:
    - name: Require target_version variable
      fail:
        msg: "target_version is required. Use: -e target_version=v2"
      when: target_version is not defined

    - name: Generate compose override file for canary {{ service_name }}
      copy:
        content: |
          version: '3.8'
          services:
            {{ service_name }}:
              environment:
                - APP_VERSION={{ target_version }}
        dest: "{{ override_dir }}/nldeploy_override_{{ service_name }}.yml"

    - name: Apply canary update for {{ service_name }}
      shell: |
        cd {{ docker_compose_dir }}
        docker compose -f {{ docker_compose_file }} \
          -f {{ override_dir }}/nldeploy_override_{{ service_name }}.yml \
          up -d --no-deps --force-recreate {{ service_name }}

    - name: Canary health check for {{ service_name }}
      uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        method: GET
      register: canary_health_check
      until: canary_health_check.status == 200
      retries: "{{ retries }}"
      delay: "{{ delay_sec }}"
      failed_when: canary_health_check.status != 200

    - name: Canary version verification for {{ service_name }}
      uri:
        url: "http://localhost:{{ host_port }}/version"
        method: GET
      register: canary_version_check
      failed_when: >
        canary_version_check.status != 200 or
        canary_version_check.json.version is not defined or
        canary_version_check.json.version != target_version

    - name: Mark canary as successful
      set_fact:
        canary_passed: true


- name: Rolling Deploy (remaining nodes)
  hosts: all[1:]
  connection: local
  gather_facts: false
  serial: 1
  vars:
    docker_compose_file: docker/docker-compose.yml
    docker_compose_dir: "{{ playbook_dir }}/.."
    override_dir: /tmp

  pre_tasks:
    - name: Stop rollout if canary failed
      fail:
        msg: "Canary validation did not pass. Aborting rollout."
      when: hostvars[groups['all'][0]].canary_passed is not defined

  tasks:
    - name: Generate compose override file for {{ service_name }}
      copy:
        content: |
          version: '3.8'
          services:
            {{ service_name }}:
              environment:
                - APP_VERSION={{ target_version }}
        dest: "{{ override_dir }}/nldeploy_override_{{ service_name }}.yml"

    - name: Apply rolling update for {{ service_name }}
      shell: |
        cd {{ docker_compose_dir }}
        docker compose -f {{ docker_compose_file }} \
          -f {{ override_dir }}/nldeploy_override_{{ service_name }}.yml \
          up -d --no-deps --force-recreate {{ service_name }}

    - name: Health check for {{ service_name }}
      uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        method: GET
      register: health_check
      until: health_check.status == 200
      retries: "{{ retries }}"
      delay: "{{ delay_sec }}"
      failed_when: health_check.status != 200

    - name: Version verification for {{ service_name }}
      uri:
        url: "http://localhost:{{ host_port }}/version"
        method: GET
      register: version_check
      failed_when: >
        version_check.status != 200 or
        version_check.json.version is not defined or
        version_check.json.version != target_version

    - name: Simulate deployment failure on selected node
      fail:
        msg: "Forced failure for demo on {{ inventory_hostname }}"
      when:
        - force_fail_node is defined
        - force_fail_node | length > 0
        - inventory_hostname == force_fail_node


- name: Update deployment marker
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    docker_compose_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Update README with deployment
      lineinfile:
        path: "{{ docker_compose_dir }}/README.md"
        regexp: "^Deployed Version:"
        line: "Deployed Version: {{ target_version }}"

---
- name: Restart services on target nodes
  hosts: all
  connection: local
  gather_facts: false
  serial: 1
  vars:
    docker_compose_file: docker/docker-compose.yml
    docker_compose_dir: "{{ playbook_dir }}/.."
  
  tasks:
    - name: Restart {{ service_name }} container
      shell: |
        cd {{ docker_compose_dir }}
        docker compose -f {{ docker_compose_file }} restart {{ service_name }}
      register: restart_result
      failed_when: restart_result.rc != 0
    
    - name: Health check for {{ service_name }} after restart
      uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        method: GET
      register: health_check
      until: health_check.status == 200
      retries: "{{ retries }}"
      delay: "{{ delay_sec }}"
    
    - name: Verify {{ service_name }} container is running
      shell: docker ps --format "{{ '{{' }}.Names{{ '}}' }}" | grep -E "{{ service_name }}"
      register: verify_running
    
    - name: Show running containers
      debug:
        msg: "{{ verify_running.stdout }}"

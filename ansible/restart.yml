---
- name: Restart services on target nodes
  hosts: all
  serial: 1
  vars:
    docker_compose_file: /tmp/{{ service_name }}_deploy/docker-compose.yml
    override_dir: /tmp/{{ service_name }}_deploy
  
  tasks:
    - name: Create override directory
      file:
        path: "{{ override_dir }}"
        state: directory
        mode: '0755'
    
    - name: Stop containers before restart
      shell: |
        cd {{ override_dir }}
        docker compose down || true
      register: stop_result
    
    - name: Wait before restart
      pause:
        seconds: 2
    
    - name: Start containers
      shell: |
        cd {{ override_dir }}
        docker compose up -d
      register: restart_result
      failed_when: restart_result.rc != 0
    
    - name: Health check after restart
      uri:
        url: "http://localhost:{{ host_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: "{{ retries }}"
      delay: "{{ delay_sec }}"
    
    - name: Log restart action
      lineinfile:
        path: "{{ override_dir }}/README.md"
        line: "- {{ ansible_date_time.iso8601 }}: Service restarted by command"
        create: yes
      ignore_errors: yes
    
    - name: Verify containers are running
      shell: docker ps | grep {{ service_name }}
      register: verify_running
    
    - name: Show running containers
      debug:
        msg: "{{ verify_running.stdout }}"

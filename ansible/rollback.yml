---
- hosts: all
  connection: local
  gather_facts: false
  serial: 1
  vars:
    docker_compose_file: docker/docker-compose.yml
    docker_compose_dir: "{{ playbook_dir }}/.."
    override_dir: /tmp

  tasks:
    - name: Require rollback_version variable
      fail:
        msg: "rollback_version is required. Use: -e rollback_version=v1"
      when: rollback_version is not defined

    - name: Generate compose override file for {{ service_name }} (rollback)
      copy:
        content: |
          version: '3.8'
          services:
            {{ service_name }}:
              environment:
                - APP_VERSION={{ rollback_version }}
        dest: "{{ override_dir }}/nldeploy_override_{{ service_name }}.yml"

    - name: Rollback {{ service_name }} to {{ rollback_version }}
      shell: |
        cd {{ docker_compose_dir }}
        docker compose -f {{ docker_compose_file }} \
          -f {{ override_dir }}/nldeploy_override_{{ service_name }}.yml \
          up -d --no-deps --force-recreate {{ service_name }}
      register: rollback_result

    - name: Health check for {{ service_name }} after rollback
      uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        method: GET
      register: health_check
      until: health_check.status == 200
      retries: "{{ retries }}"
      delay: "{{ delay_sec }}"
      failed_when: health_check.status != 200

    - name: Update README with rollback version
      lineinfile:
        path: "{{ docker_compose_dir }}/README.md"
        regexp: "^Deployed Version:"
        line: "Deployed Version: {{ rollback_version }}"
      delegate_to: localhost
      run_once: true

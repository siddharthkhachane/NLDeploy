---
- name: Scale services on target nodes
  hosts: all
  connection: local
  gather_facts: false
  serial: 1
  vars:
    docker_compose_file: docker/docker-compose.yml
    docker_compose_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Validate scale_direction
      fail:
        msg: "scale_direction must be 'up' or 'down'"
      when: scale_direction is not defined or scale_direction not in ['up', 'down']

    - name: Set target replica count
      set_fact:
        target_replicas: "{{ 2 if scale_direction == 'up' else 1 }}"

    - name: Scale {{ service_name }} to {{ target_replicas }} replicas
      shell: |
        cd {{ docker_compose_dir }}
        docker compose -f {{ docker_compose_file }} up -d --scale {{ service_name }}={{ target_replicas }} {{ service_name }}
      register: scale_result
      failed_when: scale_result.rc != 0

    - name: Health check for {{ service_name }} after scale
      uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        method: GET
      register: health_check
      until: health_check.status == 200
      retries: "{{ retries }}"
      delay: "{{ delay_sec }}"

---
- name: Stop services on target nodes
  hosts: all
  connection: local
  gather_facts: false
  serial: 1
  vars:
    docker_compose_file: docker/docker-compose.yml
    docker_compose_dir: "{{ playbook_dir }}/.."
  
  tasks:
    - name: Stop {{ service_name }} container
      shell: |
        cd {{ docker_compose_dir }}
        docker compose -f {{ docker_compose_file }} stop {{ service_name }}
      register: stop_result
      failed_when: stop_result.rc != 0
    
    - name: Verify {{ service_name }} container is stopped
      shell: |
        docker ps --format "{{ '{{' }}.Names{{ '}}' }}" | grep -E "{{ service_name }}" >/dev/null && echo "running" || echo "stopped"
      register: verify_stopped
    
    - name: Show verification result
      debug:
        msg: "{{ verify_stopped.stdout }}"
